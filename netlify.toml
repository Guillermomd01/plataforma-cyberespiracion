[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Estos valores no son secretos (nombre del CDN y remitente).
  SECRETS_SCAN_OMIT_KEYS = "BUNNY_CDN_HOST,EMAIL_FROM,BETTER_AUTH_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
